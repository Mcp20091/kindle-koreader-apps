# Secrets looked for in what's pushed (TruffleHog: keys and tokens it can check are live, and
# ones it can't tell), on top of GitHub's secret scanning and the export's personal-data check.
# Run by hand (Actions > Secrets > Run workflow) it looks through the whole history.
name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  trufflehog:
    if: github.repository == 'Mcp20091/kindle-koreader-apps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: New commits
        if: github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown

      - name: The whole history
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
